# Video Export — Overrides por cliente
#
# A maioria dos clientes não precisa de override. O Up (uploader) usa a hierarquia
# padrão `Clientes/<cliente>/Cronograma de Conteudo/Artes/<ano>/<mês>/<DD-MM-YYYY>/`.
#
# Use este arquivo quando algum cliente:
#   1. Tem pasta no Drive com nome diferente do que aparece no ClickUp / pasta local
#   2. Tem estrutura de pastas não-padrão (precisa apontar pra pasta-âncora direto)
#   3. Tem nome no ClickUp diferente da pasta local (clickup_alias)
#
# CAMPOS DISPONÍVEIS:
#   drive_nome:         Nome real da pasta no Drive (quando diferente do nome local)
#   drive_pasta_ano_id: ID da pasta-âncora no Drive (pula navegação automática).
#                       Quando preenchido, upload vai pra [pasta-âncora] / [MM. mês] / [DD-MM-YYYY]
#   clickup_alias:      Alias usado na busca de subtarefa no ClickUp
#                       (quando o nome no ClickUp difere da pasta local)
#
# Importados do prep-agenda-stark/squads/prep-agenda/config/figma-files.yaml @ d1d4de5.
# Manter sincronizado com aquele arquivo conforme novos clientes ganham estrutura não-padrão.

