# Video Export — Overrides por cliente
#
# A maioria dos clientes NÃO precisa de override. O Up (uploader) usa a hierarquia padrão:
#   clientes/<cliente_drive>/Cronograma de Conteúdo/<ano>/artes/<mes_extenso>/<DD-MM-YYYY>/
#
# QUATRO níveis são preexistentes (Uploader NUNCA cria):
#   1. clientes/                  (raiz do shared drive, manual)
#   2. <cliente_drive>/           (criado no onboarding do cliente)
#   3. Cronograma de Conteúdo/    (criado no onboarding do cliente)
#   4. artes/                     (criado pelo gestor quando arranca cada <ano>)
#
# Uploader faz fuzzy match normalizado pra achar o nome real no Drive (preserva
# case/acento original), mas NUNCA cria nenhum dos quatro. Só <ano>/, <mes_extenso>/
# e <DD-MM-YYYY>/ são criáveis sob demanda.
#
# Use este arquivo quando algum cliente:
#   1. Tem pasta no Drive com nome diferente do que o Scanner extrai do nome da pasta-local
#   2. Tem pasta-âncora de reels em local não-padrão (não em "clientes/<cli>/Cronograma de Conteúdo/<ano>/artes/")
#   3. Tem nome no ClickUp diferente do nome do cliente extraído pelo Scanner
#
# CAMPOS DISPONÍVEIS:
#   drive_nome:                   Nome real da pasta no Drive (quando diferente do nome extraído pelo Scanner).
#                                 Ex.: Scanner extrai "Diego Gonzalez" da pasta local "19-06 Diego Gonzalez";
#                                 no Drive a pasta é "Dr Diego Gonzalez".
#                                 Uploader faz fuzzy match em "clientes/" usando esse alvo.
#
#   drive_pasta_reels_id:         ID da pasta-âncora dos reels (skip o gate dos 4 wrappers padrão).
#                                 Use quando o cliente tem reels num lugar não-padrão.
#                                 No modo override TODO o subpath dentro da âncora é criável.
#
#   drive_reels_subpath_template: Template do subpath DENTRO da âncora.
#                                 Default: "{ano}/artes/{mes_extenso}/{DD-MM-YYYY}" (alinhado com a hierarquia padrão).
#                                 Tokens: {ano}, {mes} (2 dígitos), {mes_extenso} (junho), {MMMAA} (JUN26),
#                                         {DD-MM}, {DD-MM-YYYY}.
#                                 Vazio ("") → sobe direto na âncora sem subpasta.
#
#   clickup_alias:                Alias usado na busca de subtarefa no ClickUp
#                                 (quando o nome no ClickUp difere do extraído pelo Scanner).
#
# CAMPO LEGADO (não usar pra vídeos):
#   drive_pasta_ano_id:           Era pra artes estáticas (importado do prep-agenda-stark).
#                                 Mantido só por compat — o Uploader ignora pra reels.

clientes:

  # Exemplo — Diego Gonzalez: pasta-local "19-06 Diego Gonzalez", pasta-Drive "Dr Diego Gonzalez"
  "Diego Gonzalez":
    drive_nome: "Dr Diego Gonzalez"

  # Exemplo — Luiza Coutinho: idem, mas com prefixo "Dra"
  "Luiza Coutinho":
    drive_nome: "Dra Luiza Coutinho"

  "Jussara":
    drive_nome: "Dra Jussara"
    clickup_alias: "Jussara Lazarini"   # subtarefas ClickUp usam o sobrenome

  "Fernanda Marció":
    drive_nome: "Dra Fernanda Marció"

# Clientes sem entrada aqui caem no modo padrão:
#   wrapper raiz   = "clientes" (fuzzy exato normalizado)
#   pasta-cliente  = nome extraído pelo Scanner (fuzzy normalizado)
#   pasta-cronograma = "Cronograma de Conteúdo" (fuzzy normalizado, aceita variantes legadas)
#   pasta-artes    = "artes" (fuzzy exato normalizado, sem variantes)
#   subpath criável = "{ano}/artes/{mes_extenso}/{DD-MM-YYYY}" (sub-pasta "artes" é gate, não criável)
#
# Se a busca falhar (qualquer um dos 4 wrappers ausente OU subtarefa não encontrada),
# vai pra pendências — Uploader e Matcher NUNCA criam wrapper preexistente nem task nova.

# Entradas legadas do prep-agenda-stark (estrutura de artes — não aplicável a vídeos)
# Mantidas só pra referência cruzada; o Uploader ignora drive_pasta_ano_id pra reels.
